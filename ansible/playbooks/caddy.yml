---
- name: Caddy reverse proxy
  hosts: tag_role_caddy
  pre_tasks:
    - name: Load platform secrets
      tags: [always]
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/platform.sops.yaml"
      no_log: true

    - name: Verify every backend resolved
      tags: [always]
      ansible.builtin.assert:
        that:
          - hlac.public_services | length > 0
          - hlac.public_services.values() | selectattr('backend_ipv4', 'none') | list | length == 0
        fail_msg: "A public service has no backend address. Run terraform apply."

  roles:
    - caddy
