- name: PowerDNS Recursor
  hosts: tag_role_recursor
  pre_tasks:
    - name: Build reverse zone list from registry
      ansible.builtin.set_fact:
        recursor_reverse_zones: "{{ hlac.reverse_zones_v4.values() | unique | list }}"

    # Internal and reverse zones are forwarded to the authoritative servers
    - name: Build authoritative target list from inventory
      ansible.builtin.set_fact:
        recursor_auth_targets: >-
          {{ groups['tag_role_pdns'] | default([]) | sort
             | map('extract', hostvars, 'ansible_host') | list }}

    - name: Verify authoritative servers were discovered
      ansible.builtin.assert:
        that: recursor_auth_targets | length > 0
        fail_msg: "No tag_role_pdns hosts in inventory; the recursor would forward internal zones nowhere."

  roles:
    - recursor
