- name: PowerDNS Authoritative
  hosts: tag_role_pdns
  pre_tasks:
    - name: Load platform secrets
      tags: [always]
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/platform.sops.yaml"
      no_log: true

    - name: Build recursor DNS allow-list from inventory
      tags: [always]
      ansible.builtin.set_fact:
        pdns_dns_allowed: >-
          {{ groups['tag_role_recursor'] | default([])
             | map('extract', hostvars, 'ansible_host')
             | map('regex_replace', '$', '/32')
             | list }}

    - name: Build API allow-list from management VLAN plus static admin hosts
      tags: [always]
      ansible.builtin.set_fact:
        pdns_api_allowed: >-
          {{ [hlac.vlans[pdns_api_vlan].prefix_v4] + pdns_api_static_allowed }}

  roles:
    - powerdns
