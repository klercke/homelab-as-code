---
- name: Public website
  hosts: tag_role_web
  vars:
    web_deploy_root: "/srv/http/klercke.com/public"
    caddy_mode: "site"
    caddy_cloudflare_api_token: "{{ web_cloudflare_api_token }}"
    caddy_sites:
      klercke.com:
        root: "{{ web_deploy_root }}"
        aliases:
          - "www.klercke.com"
        error_template: "/404.html"
        plausible_script: "/js/pa-Ol-QVpdHOyuKkkUSi7859.js"
        access_log: true
  pre_tasks:
    - name: Load platform secrets
      tags: [always]
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/platform.sops.yaml"
      no_log: true
  roles:
    - web
    - caddy
