[defaults]
inventory              = inventories/protonet/proxmox.yml
roles_path             = roles
remote_user            = ansible
private_key_file       = ~/.ssh/protonet_admin
# Fixes Python depedency issues on netbox01
interpreter_python     = /usr/bin/python3
callback_result_format = yaml
callbacks_enabled      = profile_tasks
force_handlers         = True
# pve01 is CPU-starved; the default 10s also bounds the sudo prompt wait
timeout                = 60

[ssh_connection]
ssh_args   = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

[privilege_escalation]
become        = True
become_method = sudo
