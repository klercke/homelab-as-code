- name: Import ISC GPG key
  tags: [install]
  ansible.builtin.rpm_key:
    key: "https://dl.cloudsmith.io/public/isc/kea-{{ kea_repo_track }}/gpg.720DD962343B440F.key"
    state: present

- name: Install ISC Kea vendor repo
  tags: [install]
  ansible.builtin.get_url:
    url: "https://dl.cloudsmith.io/public/isc/kea-{{ kea_repo_track }}/cfg/setup/config.rpm.txt?distro=el&codename=9"
    dest: "/etc/yum.repos.d/isc-kea-{{ kea_repo_track }}.repo"
    mode: "0644"

- name: Install Kea
  tags: [install]
  ansible.builtin.dnf:
    name:
      - isc-kea-dhcp4
      - isc-kea-dhcp6
      - isc-kea-dhcp-ddns
      - isc-kea-admin
      - isc-kea-hooks
      - isc-kea-pgsql
    state: present

# kea-admin shells out to psql for the pgsql backend
- name: Install PostgreSQL client for kea-admin
  tags: [install]
  ansible.builtin.dnf:
    name: postgresql
    state: present

- name: Check Kea schema version
  tags: [install]
  ansible.builtin.command:
    cmd: >-
      kea-admin db-version pgsql
      -u {{ kea_db_user }} -p {{ postgres_kea_password }}
      -n {{ kea_db_name }} -h {{ kea_db_host }}
  register: _kea_schema
  changed_when: false
  failed_when: false
  no_log: true
  run_once: true

- name: Initialize Kea schema
  tags: [install]
  ansible.builtin.command:
    cmd: >-
      kea-admin db-init pgsql
      -u {{ kea_db_user }} -p {{ postgres_kea_password }}
      -n {{ kea_db_name }} -h {{ kea_db_host }}
  when: _kea_schema.rc != 0
  no_log: true
  run_once: true

- name: Check the hlac API password is in SOPS
  tags: [config]
  ansible.builtin.assert:
    that: kea_hlac_api_password is defined
    fail_msg: >-
      kea_hlac_api_password is missing from secrets/platform.sops.yaml.
      Add it with sops set before running this role.
    quiet: true

- name: Write hlac API auth secret file
  tags: [config]
  ansible.builtin.copy:
    content: "{{ kea_hlac_user }}:{{ kea_hlac_password }}\n"
    dest: "/etc/kea/{{ kea_hlac_secret_file }}"
    owner: root
    group: kea
    mode: "0640"
  no_log: true
  notify: Restart kea-dhcp4

- name: Write API auth secret file
  tags: [config]
  ansible.builtin.copy:
    content: "{{ kea_api_user }}:{{ kea_api_password }}\n"
    dest: "/etc/kea/{{ kea_api_secret_file }}"
    owner: root
    group: kea
    mode: "0640"
  no_log: true
  notify: Restart kea-dhcp4

# Validated before it replaces the live file, so a bad template never reaches
# disk or triggers a restart. The secret file above must exist first because
# the config references it. no_log hides kea-dhcp4's error output too; on a
# validation failure, render and test by hand with kea-dhcp4 -t.
- name: Write kea-dhcp4.conf
  tags: [config]
  ansible.builtin.template:
    src: kea-dhcp4.conf.j2
    dest: /etc/kea/kea-dhcp4.conf
    owner: root
    group: kea
    mode: "0640"
    validate: kea-dhcp4 -t %s
    backup: true
  no_log: true
  notify: Restart kea-dhcp4

- name: Find kea-dhcp4.conf backups
  tags: [config]
  ansible.builtin.find:
    paths: /etc/kea
    patterns: "kea-dhcp4.conf.*~"
  register: _kea_backups

- name: Prune old kea-dhcp4.conf backups
  tags: [config]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (_kea_backups.files | sort(attribute='mtime', reverse=true))[kea_config_backups_kept:] }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Open DHCP server port
  tags: [firewall]
  ansible.posix.firewalld:
    service: dhcp
    permanent: true
    immediate: true
    state: enabled

- name: Allow HA peer communication
  tags: [firewall]
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ item.ip }}/32
      port port={{ kea_ha_port }} protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ kea_ha_peers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Allow API access
  tags: [firewall]
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ item }}
      port port={{ kea_api_port }} protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ [hlac.vlans[kea_api_vlan].prefix_v4] + kea_api_static_allowed }}"

- name: Create systemd drop-in directory
  tags: [config]
  ansible.builtin.file:
    path: /etc/systemd/system/kea-dhcp4.service.d
    state: directory
    mode: "0755"

- name: Install custom Kea DCHPv4 Systemd service drop-in
  tags: [config]
  ansible.builtin.template:
    src: 10-protonet.conf.j2
    dest: /etc/systemd/system/kea-dhcp4.service.d/10-protonet.conf
    mode: "0644"
  notify: Reload systemd

- name: Enable kea-dhcp4 at boot
  tags: [service]
  ansible.builtin.systemd_service:
    name: kea-dhcp4
    enabled: true
