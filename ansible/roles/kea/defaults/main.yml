kea_repo_track: "3-2"

kea_db_host: 10.0.20.10
kea_db_name: kea
kea_db_user: kea

# The VLAN (from vlans.yaml) that the Kea hosts run on
# All clients on other VLANs reach Kea via relay
kea_local_vlan: "home-servers"

kea_interface: "{{ ansible_default_ipv4.interface }}"

kea_ha_port: 8001

kea_api_port: 8000
kea_api_user: "kea-ha"
kea_api_password: "{{ kea_ca_password }}"
kea_api_secret_file: kea-api-secret

# OpenTofu's API client (KEA_DHCP4_HTTP_USERNAME/PASSWORD in .envrc), kept
# separate from kea-ha so the HA peers' credentials never leave the Kea hosts.
kea_hlac_user: "hlac"
kea_hlac_password: "{{ kea_hlac_api_password }}"
kea_hlac_secret_file: kea-api-secret-hlac
kea_api_vlan: "home-management"  # All hosts on this VLAN can reach Kea's API
kea_api_static_allowed:
  - 10.0.10.213/32  # Thor

# Will be built from inventory
kea_resolvers: []

# First entry is also sent as domain-name (option 15) for clients that ignore
# domain-search (option 119). Defined once in group_vars/all/dns.yml.
kea_search_domains: "{{ protonet_search_domains }}"

# Timestamped copies of kea-dhcp4.conf kept in /etc/kea after changes
kea_config_backups_kept: 5

kea_valid_lifetime: 3600
kea_renew_timer: 900
kea_rebind_timer: 1800
