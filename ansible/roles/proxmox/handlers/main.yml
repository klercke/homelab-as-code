---
- name: Restart Proxmox web proxies
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ ansible_facts.services.keys() | intersect(['pveproxy.service', 'proxmox-backup-proxy.service']) }}"

# ifreload comes with ifupdown2, which PVE and PBS both install. Turning
# autoconf off doesn't remove addresses SLAAC already made, so drop those.
- name: Reload networking
  ansible.builtin.shell: |
    set -e
    ifreload -a
    ip -6 addr flush dev {{ proxmox_ipv6_iface | quote }} scope global dynamic
  changed_when: true
