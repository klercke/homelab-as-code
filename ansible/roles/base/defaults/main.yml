base_packages:
  - qemu-guest-agent
  - chrony
  - policycoreutils-python-utils
  - python3-libselinux
  - firewalld
  - dnf-automatic
  - vim-enhanced
  - bind-utils
  - tcpdump

base_timezone: America/New_York

# Host firewall. See note below before changing.
base_firewalld_enabled: true

# Resolvers: the first two recursors from the registry, then a public fallback
# for when none answers (a fresh build, or both recursors down). glibc reads at
# most three nameservers. Matches bootstrap_resolver in terraform/substrate.
base_fallback_resolver: "9.9.9.9"
base_resolvers: >-
  {{ (hlac.hosts | dict2items | selectattr('value.role', 'equalto', 'recursor')
      | map(attribute='key') | sort | map('extract', hlac.hosts, 'ipv4') | list)[:2]
     + [base_fallback_resolver] }}
base_resolver_options: ["timeout:1", "attempts:2"]
base_search_domains: "{{ protonet_search_domains }}"

# Personal login accounts. Keys are read from keys/ at the repo root.
base_login_users: "{{ protonet_login_users }}"
base_keys_dir: "{{ playbook_dir }}/../../keys"

# Applied by service roles, not here.
base_firewall_services:
  - ssh

node_exporter_version: "1.12.1"
node_exporter_sha256: "b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"
node_exporter_port: 9100

# Scraped by monitoring01
node_exporter_allowed_cidr: "10.0.20.20/32"
