# Point the host at the ProtoNet recursors instead of the cloud-init bootstrap
# resolver, with the shared search list.
#
# glibc reads at most three nameservers, so this is the first two recursors
# (sorted, so recursor01 leads, plus the bootstrap resolver as a last resort.
# With timeout:1 a dead recursor costs a second, and a fresh build where no
# recursor exists yet still resolves through the fallback. While both recursors
# are down, internal names fail to resolve.

# cloud-init writes /etc/resolv.conf itself and sets dns=none in
# 99-cloud-init.conf so NetworkManager leaves it alone. A later conf.d file
# hands resolv.conf back to NetworkManager, which then writes it from the
# connection settings below. cloud-init only renders network config on first
# boot, so this survives reboots.
- name: Let NetworkManager manage resolv.conf
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/99-zz-protonet-dns.conf
    content: |
      # Managed by Ansible (hlac base role). Overrides dns=none from cloud-init.
      [main]
      dns=default
    owner: root
    group: root
    mode: "0644"
  register: _dns_nmconf

- name: Find the NetworkManager connection for resolvers
  ansible.builtin.command:
    cmd: nmcli -g GENERAL.CONNECTION device show {{ ansible_default_ipv4.interface }}
  register: _dns_conn
  changed_when: false

- name: Configure resolvers and search domains
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      fields=ipv4.dns,ipv4.dns-search,ipv4.dns-options,ipv4.ignore-auto-dns
      before=$(nmcli -g "$fields" connection show {{ _dns_conn.stdout | quote }})
      nmcli connection modify {{ _dns_conn.stdout | quote }} \
        ipv4.dns {{ base_resolvers | join(',') | quote }} \
        ipv4.dns-search {{ base_search_domains | join(',') | quote }} \
        ipv4.dns-options {{ base_resolver_options | join(',') | quote }} \
        ipv4.ignore-auto-dns yes
      after=$(nmcli -g "$fields" connection show {{ _dns_conn.stdout | quote }})
      if [ "$before" != "$after" ]; then echo CHANGED; fi
  register: _dns_modify
  changed_when: "'CHANGED' in _dns_modify.stdout"

# Same as the IPv6 settings: reapply keeps the IPv4 SSH session up.
- name: Apply resolver settings to the running interface # noqa: no-handler
  ansible.builtin.command:
    cmd: nmcli device reapply {{ ansible_default_ipv4.interface }}
  when: _dns_modify is changed
  changed_when: true

- name: Read resolv.conf before reload
  ansible.builtin.slurp:
    src: /etc/resolv.conf
  register: _dns_resolvconf_before

# Runs whenever resolv.conf is not NetworkManager's yet, not only when the
# conf.d file changes, so a run that failed after writing the file recovers.
# nmcli general reload takes one flag per call.
- name: Reload NetworkManager config and rewrite resolv.conf
  ansible.builtin.command:
    cmd: nmcli general reload {{ item }}
  loop: [conf, dns-full]
  when: >-
    _dns_nmconf is changed or
    'Generated by NetworkManager' not in (_dns_resolvconf_before.content | b64decode)
  changed_when: true

- name: Read resolv.conf
  ansible.builtin.slurp:
    src: /etc/resolv.conf
  register: _dns_resolvconf

# Fails loudly if NetworkManager is not the one writing resolv.conf, instead of
# reporting success while the host still uses the bootstrap resolver.
- name: Check resolv.conf uses the recursors and search list
  ansible.builtin.assert:
    that:
      - (_dns_resolvconf.content | b64decode) is search('(?m)^nameserver ' ~ (base_resolvers | first | regex_escape) ~ '$')
      - (_dns_resolvconf.content | b64decode) is search('(?m)^search ' ~ (base_search_domains | map('regex_escape') | join(' ')) ~ '$')
    fail_msg: "/etc/resolv.conf does not list {{ base_resolvers | first }} and the search list:\n{{ _dns_resolvconf.content | b64decode }}"
    quiet: true
