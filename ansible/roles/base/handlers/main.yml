- name: Restart sshd
  ansible.builtin.systemd_service:
    name: sshd
    state: restarted

- name: Restart dnf-automatic timer
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    state: restarted

- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
