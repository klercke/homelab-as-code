---
- name: Install zram-tools
  tags: [install]
  ansible.builtin.apt:
    name: zram-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure zram swap
  tags: [config]
  ansible.builtin.template:
    src: zramswap.j2
    dest: /etc/default/zramswap
    owner: root
    group: root
    mode: "0644"
  notify: Restart zramswap

- name: Enable zram swap
  tags: [service]
  ansible.builtin.systemd_service:
    name: zramswap
    enabled: true
    state: started
