---
# Compressed swap in RAM. Guests are overcommitted via ballooning, so this
# turns a host OOM into a slowdown. Never swap to a ZFS zvol: it can deadlock
# under exactly the memory pressure swap exists for.
hypervisor_zram_algo: "zstd"
hypervisor_zram_percent: 25
hypervisor_zram_priority: 100

# PBS storages. Each host signs in with its own token on the pbs role's
# service user; the token secret comes from SOPS as pbs01_<host>_token.
# Every host shares one client encryption key (pbs_encryption_key in SOPS),
# so guests that move between hosts keep deduplicating.
hypervisor_pbs_server: "pbs01.prd.hme.protonet.internal"
hypervisor_pbs_fingerprint: "64:c4:60:80:24:f7:a6:8c:94:9b:30:3e:a8:0f:57:be:0e:f7:34:d8:48:41:bd:30:b2:28:8e:23:b7:b7:ce:77"
hypervisor_pbs_user: "pve@pbs"
hypervisor_pbs_storages:
  - id: "pbs-local"
    datastore: "local"
  - id: "pbs-wasabi"
    datastore: "wasabi"
# Scratch path for the client key while pvesm reads it; removed afterwards.
hypervisor_pbs_key_file: "/root/.hlac-pbs-client.enc"
