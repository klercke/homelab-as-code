- name: Restart postgresql
  ansible.builtin.systemd_service:
    name: "postgresql-{{ postgres_version }}"
    state: restarted

- name: Reload postgresql
  ansible.builtin.systemd_service:
    name: "postgresql-{{ postgres_version }}"
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart postgres_exporter
  ansible.builtin.systemd_service:
    name: postgres_exporter
    state: restarted
