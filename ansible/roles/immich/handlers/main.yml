---
- name: Restart immich-postgres
  ansible.builtin.systemd_service:
    name: immich-postgres
    state: restarted
    daemon_reload: true

- name: Restart immich-server
  ansible.builtin.systemd_service:
    name: immich-server
    state: restarted
    daemon_reload: true

- name: Restart immich-ml
  ansible.builtin.systemd_service:
    name: immich-ml
    state: restarted
    daemon_reload: true

- name: Restart immich-public-proxy
  ansible.builtin.systemd_service:
    name: immich-public-proxy
    state: restarted
    daemon_reload: true

- name: Restart immich-stack
  ansible.builtin.systemd_service:
    name: immich-stack
    state: restarted
    daemon_reload: true
