---
- name: Install Grafana repo
  tags: [install]
  ansible.builtin.yum_repository:
    name: grafana
    description: "Grafana OSS"
    baseurl: "https://rpm.grafana.com"
    gpgkey: "https://rpm.grafana.com/gpg.key"
    gpgcheck: true
    repo_gpgcheck: true
    enabled: true

- name: Install Grafana
  tags: [install]
  ansible.builtin.dnf:
    name: grafana
    state: present

- name: Install jq for dashboard normalisation
  tags: [install]
  ansible.builtin.dnf:
    name: jq
    state: present

- name: Point Grafana at the data volume
  tags: [config]
  ansible.builtin.file:
    path: "{{ monitoring_data_dir }}/grafana"
    state: directory
    owner: grafana
    group: grafana
    mode: "0750"

- name: Configure Grafana
  tags: [config]
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  no_log: true
  notify: Restart grafana

- name: Provision datasources
  tags: [config]
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/protonet.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Create dashboard directory
  tags: [config]
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Create community dashboard directory
  tags: [config]
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards/Community
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Fetch community dashboards
  tags: [install]
  ansible.builtin.get_url:
    url: "https://grafana.com/api/dashboards/{{ item.id }}/revisions/latest/download"
    dest: "/var/cache/dashboard-{{ item.name }}.json"
    mode: "0644"
  loop: "{{ grafana_dashboards }}"
  loop_control:
    label: "{{ item.name }}"

# jq renders to stdout and copy writes the file, so the dashboard (and the
# Grafana restart) only changes when the rendered JSON actually differs.
- name: Normalise dashboards for file provisioning
  tags: [config]
  ansible.builtin.command:
    cmd: >-
      jq --arg name {{ item.name | quote }}
      'del(.__inputs) | del(.__requires) | .uid = ("community-" + $name)
      | walk(if type == "object" and .type? == "prometheus" and has("uid") then .uid = "prometheus" else . end)'
      /var/cache/dashboard-{{ item.name }}.json
  register: monitoring_dashboards_rendered
  changed_when: false
  loop: "{{ grafana_dashboards }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install normalised dashboards
  tags: [config]
  ansible.builtin.copy:
    content: "{{ item.stdout }}\n"
    dest: "/var/lib/grafana/dashboards/Community/{{ item.item.name }}.json"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ monitoring_dashboards_rendered.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  notify: Restart grafana

- name: Open UI ports
  tags: [firewall]
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ item.0 }}
      port port={{ item.1 }} protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ monitoring_ui_allowed | product([grafana_port, prometheus_port]) | list }}"

- name: Allow caddy01 to reach Grafana
  tags: [firewall]
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ hostvars['caddy01'].ansible_host }}/32
      port port={{ grafana_port }} protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled

- name: Enable Grafana
  tags: [service]
  ansible.builtin.systemd_service:
    name: grafana-server
    enabled: true
    state: started
