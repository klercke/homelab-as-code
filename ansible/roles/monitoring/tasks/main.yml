---
- name: Create filesystem on data device
  tags: [install]
  community.general.filesystem:
    fstype: xfs
    dev: "{{ monitoring_data_device }}"
    opts: "-L {{ monitoring_data_label }}"

- name: Mount data volume
  tags: [install]
  ansible.posix.mount:
    path: "{{ monitoring_data_dir }}"
    src: "LABEL={{ monitoring_data_label }}"
    fstype: xfs
    opts: defaults,noatime
    state: mounted

# Static imports so tags reach each task, e.g. just role monitoring --tags dashboards
- name: Install Prometheus
  ansible.builtin.import_tasks: prometheus.yml
  tags: [prometheus]

- name: Install Grafana
  ansible.builtin.import_tasks: grafana.yml
  tags: [grafana]

- name: Install Grafana dashboards
  ansible.builtin.import_tasks: dashboards.yml
  tags: [dashboards]
