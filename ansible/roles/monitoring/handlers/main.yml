---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: reloaded

- name: Restart prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted

- name: Restart grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
