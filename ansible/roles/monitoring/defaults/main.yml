---
monitoring_data_device: /dev/sdb
monitoring_data_label: mondata
monitoring_data_dir: /var/lib/monitoring

# Size-based retention self-limits as the series count grows, unlike a time
# limit which balloons when exporters are added.
prometheus_version: "3.13.1"
prometheus_sha256: "962b812371aff838d152b6ff2d56fdb7a6396f5542f48ebf73421b9721f0d103"
prometheus_port: 9090
prometheus_retention_size: "45GB"
prometheus_scrape_interval: "30s"

grafana_port: 3000

# Grafana.com dashboard IDs, fetched and provisioned as files
grafana_dashboards:
  - { id: 1860, name: "node-exporter-full" }
  - { id: 9628, name: "postgresql" }

# Grafana is fronted by caddy01, so only the proxy and the management VLAN
# need direct access to the UI.
monitoring_ui_allowed:
  - "10.0.20.19/32"
  - "10.0.60.0/24"

# Exporter ports by role, used to build the file_sd target lists
monitoring_scrape_jobs:
  node:
    port: 9100
    roles: []  # empty means every host and device
  postgres:
    port: 9187
    roles: ["postgres"]
  pdns:
    port: 8081
    roles: ["pdns"]
  recursor:
    port: 8082
    roles: ["recursor"]
  netbox:
    port: 80
    roles: ["netbox"]
  caddy:
    port: 9180
    roles: ["caddy"]

# Every active printer in devices.yaml with an address.
monitoring_printers: >-
  {{ hlac.devices | dict2items
     | selectattr('value.role', 'equalto', 'printer-3d')
     | selectattr('value.status', 'equalto', 'active')
     | selectattr('value.ipv4') | items2dict }}

prusa_exporter_version: "2.0.0"
prusa_exporter_sha256: "67b0a5704023905e73658b5c5f3fc3c10c302031d92a4301169bfa94839ec344"
prusa_exporter_port: 10009
prusa_exporter_udp_port: 8514
# Off because the slicer start G-code enables metrics instead.
# When on, every exporter restart prompts a "print" on the printer.
prusa_exporter_send_gcode: false
# The printer_model label the dashboards filter on, per device type.
prusa_exporter_models:
  prusa-core-one-plus-gen2: "Core One"
