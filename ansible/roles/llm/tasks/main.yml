---
- name: Load the model registry
  tags: [always]
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../registries/models.yaml"
    name: llm_models

- name: Install podman
  tags: [install]
  ansible.builtin.dnf:
    name: podman
    state: present

- name: Create config directory
  tags: [config]
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ llm_config_dir }}"

- name: Create data directories
  tags: [config]
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ llm_openwebui_data_dir }}"
    - "{{ llm_embed_cache_dir }}"

- name: Write LiteLLM config
  tags: [config]
  ansible.builtin.template:
    src: litellm.yaml.j2
    dest: "{{ llm_config_dir }}/litellm.yaml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart litellm

- name: Install the persona hook
  tags: [config]
  ansible.builtin.copy:
    src: persona.py
    dest: "{{ llm_config_dir }}/persona.py"
    owner: root
    group: root
    mode: "0640"
  notify: Restart litellm

- name: Write persona prompts
  tags: [config]
  ansible.builtin.template:
    src: persona.json.j2
    dest: "{{ llm_config_dir }}/persona.json"
    owner: root
    group: root
    mode: "0640"
  # Holds the personal prompts decrypted from SOPS
  no_log: true
  notify: Restart litellm

- name: Write LiteLLM environment
  tags: [config]
  ansible.builtin.template:
    src: litellm.env.j2
    dest: "{{ llm_config_dir }}/litellm.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart litellm

- name: Write Open WebUI environment
  tags: [config]
  ansible.builtin.template:
    src: openwebui.env.j2
    dest: "{{ llm_config_dir }}/openwebui.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart open-webui

- name: Write SearXNG settings
  tags: [config]
  ansible.builtin.template:
    src: searxng.yml.j2
    dest: "{{ llm_config_dir }}/searxng.yml"
    owner: root
    group: root
    # The container runs as an unprivileged user that must read it, so the
    # secret lives in searxng.env instead
    mode: "0644"
  notify: Restart searxng

- name: Write SearXNG environment
  tags: [config]
  ansible.builtin.copy:
    content: "SEARXNG_SECRET={{ searxng_secret_key }}\n"
    dest: "{{ llm_config_dir }}/searxng.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart searxng

# Pull outside systemd: the Open WebUI image is several GB, and pulling it as
# part of unit start blows through TimeoutStartSec on a slow host, after which
# every retry discards the partial layers and starts over.
- name: Pull container images
  tags: [install]
  ansible.builtin.shell:
    cmd: podman image exists "{{ item }}" && echo present || podman pull --quiet "{{ item }}"
  loop:
    - "{{ llm_litellm_image }}"
    - "{{ llm_openwebui_image }}"
    - "{{ llm_searxng_image }}"
    - "{{ llm_embed_image }}"
  register: _llm_pull
  changed_when: "'present' not in _llm_pull.stdout"
  async: 3600
  poll: 15
  notify:
    - Restart litellm
    - Restart open-webui
    - Restart searxng
    - Restart llm-embed

- name: Install quadlets
  tags: [config]
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/containers/systemd/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: litellm.container.j2, dest: litellm.container }
    - { src: open-webui.container.j2, dest: open-webui.container }
    - { src: searxng.container.j2, dest: searxng.container }
    - { src: llm-embed.container.j2, dest: llm-embed.container }
  loop_control:
    label: "{{ item.dest }}"
  notify:
    - Restart litellm
    - Restart open-webui
    - Restart searxng
    - Restart llm-embed

- name: Allow the reverse proxy
  tags: [firewall]
  ansible.posix.firewalld:
    rich_rule: "rule family=ipv4 source address={{ item.0 }}/32 port port={{ item.1 }} protocol=tcp accept"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ llm_allowed_hosts | product([llm_litellm_port, llm_openwebui_port]) | list }}"

# Quadlet units are generated, so they can't be enabled; WantedBy in the
# .container file handles boot. This only starts them the first time.
- name: Start services
  tags: [service]
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    daemon_reload: true
  loop:
    - litellm
    - open-webui
    - searxng
    - llm-embed

# LiteLLM keys for clients hlac manages (llm_keys). LiteLLM accepts a
# caller-chosen key value, so each value lives in SOPS and this only makes sure
# LiteLLM knows about it, with the settings from llm_keys.
- name: Wait for LiteLLM
  tags: [keys]
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_litellm_port }}/health/liveliness"
  register: _litellm_live
  until: _litellm_live.status == 200
  retries: 30
  delay: 5

- name: Look up the Open WebUI key
  tags: [keys]
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_litellm_port }}/key/info?key={{ litellm_openwebui_key | urlencode }}"
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    status_code: [200, 400, 404]
  register: _openwebui_key
  no_log: true

- name: Look up managed keys
  tags: [keys]
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_litellm_port }}/key/info?key={{ lookup('ansible.builtin.vars', item.secret) | urlencode }}"
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    status_code: [200, 400, 404]
  loop: "{{ llm_keys }}"
  register: _llm_keys
  no_log: true

- name: Register managed keys
  tags: [keys]
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_litellm_port }}/key/generate"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    body_format: json
    body: "{{ _settings | combine({'key': lookup('ansible.builtin.vars', item.item.secret), 'key_alias': item.item.alias, 'metadata': {'managed_by': 'hlac'}}) }}"
  vars:
    _settings: "{{ item.item | dict2items | rejectattr('key', 'in', ['alias', 'secret']) | items2dict }}"
  loop: "{{ _llm_keys.results }}"
  when: item.status != 200
  changed_when: true
  no_log: true

- name: Keep managed keys in step
  tags: [keys]
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_litellm_port }}/key/update"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    body_format: json
    body: "{{ _settings | combine({'key': lookup('ansible.builtin.vars', item.item.secret)}) }}"
  vars:
    _settings: "{{ item.item | dict2items | rejectattr('key', 'in', ['alias', 'secret']) | items2dict }}"
    _info: "{{ item.json.info | default({}) }}"
  loop: "{{ _llm_keys.results }}"
  when:
    - item.status == 200
    - (_settings.max_budget is defined and (_info.max_budget | default(0, true) | float) != (_settings.max_budget | float))
      or (_settings.budget_duration is defined and (_info.budget_duration | default('', true)) != _settings.budget_duration)
      or (_settings.models is defined and (_info.models | default([], true) | sort) != (_settings.models | sort))
  changed_when: true
  no_log: true
