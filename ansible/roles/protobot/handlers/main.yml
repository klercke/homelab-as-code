---
- name: Restart protobot
  become: true
  become_user: "{{ protobot_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ _protobot_runtime }}"
  ansible.builtin.systemd_service:
    name: "protobot-{{ item }}"
    state: restarted
    daemon_reload: true
    scope: user
  loop: "{{ protobot_environments }}"
