netbox_version: "4.6.5"
netbox_python: /usr/bin/python3.12
netbox_root: /opt/netbox
netbox_user: netbox

netbox_db_host: 10.0.20.10
netbox_db_name: netbox
netbox_db_user: netbox

netbox_redis_host: 10.0.20.18
netbox_redis_port: 6379

netbox_allowed_hosts:
  - netbox01.prd.hme.protonet.internal
  - netbox01
  - 10.0.20.11
  - netbox.int.ptxe.dev

netbox_csrf_origins: ["https://netbox.int.ptxe.dev"]

# Object types the hlac service user may write: everything terraform/platform
# manages. Primary IP and primary MAC resources only change devices, VMs,
# and interfaces, which are already listed.
netbox_hlac_write_types:
  - dcim.region
  - dcim.site
  - dcim.location
  - dcim.rack
  - dcim.manufacturer
  - dcim.devicerole
  - dcim.devicetype
  - dcim.device
  - dcim.devicebay
  - dcim.interface
  - dcim.macaddress
  - dcim.platform
  - ipam.rir
  - ipam.aggregate
  - ipam.role
  - ipam.prefix
  - ipam.iprange
  - ipam.ipaddress
  - ipam.vlangroup
  - ipam.vlan
  - ipam.service
  - virtualization.clustertype
  - virtualization.cluster
  - virtualization.virtualmachine
  - virtualization.vminterface
  - virtualization.virtualdisk
  - extras.tag
