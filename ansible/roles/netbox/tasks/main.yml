- name: Install dependencies
  tags: [install]
  ansible.builtin.dnf:
    name:
      - python3.12
      - python3.12-devel
      - gcc
      - libpq-devel
      - libxml2-devel
      - libxslt-devel
      - libffi-devel
      - openssl-devel
      - redhat-rpm-config
      - nginx
      - git
    state: present

- name: Verify Python version
  tags: [install]
  ansible.builtin.command: "{{ netbox_python }} -V"
  register: _py
  changed_when: false
  failed_when: _py.stdout is not search('3\.(1[2-9]|[2-9][0-9])')

- name: Create netbox user
  tags: [install]
  ansible.builtin.user:
    name: "{{ netbox_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ netbox_root }}"
    create_home: false

- name: Create release directory
  tags: [install]
  ansible.builtin.file:
    path: "/opt/netbox-{{ netbox_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download NetBox
  tags: [install]
  ansible.builtin.get_url:
    url: "https://github.com/netbox-community/netbox/archive/refs/tags/v{{ netbox_version }}.tar.gz"
    dest: "/var/cache/netbox-{{ netbox_version }}.tar.gz"
    mode: "0644"

- name: Extract NetBox
  tags: [install]
  ansible.builtin.unarchive:
    src: "/var/cache/netbox-{{ netbox_version }}.tar.gz"
    dest: "/opt/netbox-{{ netbox_version }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "/opt/netbox-{{ netbox_version }}/netbox/manage.py"

- name: Link current release
  tags: [install]
  ansible.builtin.file:
    src: "/opt/netbox-{{ netbox_version }}"
    dest: "{{ netbox_root }}"
    state: link
  notify:
    - Restart netbox
    - Restart netbox-rq

- name: Own runtime directories
  tags: [config]
  ansible.builtin.file:
    path: "/opt/netbox-{{ netbox_version }}/netbox/{{ item }}"
    state: directory
    owner: "{{ netbox_user }}"
    group: "{{ netbox_user }}"
    mode: "0755"
  loop: [media, reports, scripts]

- name: Write configuration.py
  tags: [config]
  ansible.builtin.template:
    src: configuration.py.j2
    dest: "{{ netbox_root }}/netbox/netbox/configuration.py"
    owner: root
    group: "{{ netbox_user }}"
    mode: "0640"
  no_log: true
  notify:
    - Restart netbox
    - Restart netbox-rq

- name: Install gunicorn config
  tags: [install]
  ansible.builtin.copy:
    src: "{{ netbox_root }}/contrib/gunicorn.py"
    dest: "{{ netbox_root }}/gunicorn.py"
    remote_src: true
    force: false
    mode: "0644"

- name: Run upgrade.sh
  tags: [install]
  ansible.builtin.command:
    cmd: "{{ netbox_root }}/upgrade.sh"
  environment:
    PYTHON: "{{ netbox_python }}"
  args:
    creates: "/opt/netbox-{{ netbox_version }}/venv/bin/python"
  notify:
    - Restart netbox
    - Restart netbox-rq

- name: Install systemd units
  tags: [config]
  ansible.builtin.copy:
    src: "{{ netbox_root }}/contrib/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    remote_src: true
    mode: "0644"
  loop: [netbox.service, netbox-rq.service]
  notify: Reload systemd

- name: Allow nginx to reach gunicorn
  tags: [config]
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true

- name: Configure nginx
  tags: [config]
  ansible.builtin.template:
    src: nginx-netbox.conf.j2
    dest: /etc/nginx/conf.d/netbox.conf
    mode: "0644"
  notify: Restart nginx

- name: Open HTTP
  tags: [firewall]
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled

- name: Enable services
  tags: [service]
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [netbox, netbox-rq, nginx]

# admin is the break-glass login and holds no token. OpenTofu's token
# (NETBOX_API_TOKEN) belongs to the hlac service user (active, no password), which can read every
# object type except users and tokens, and write only what terraform/platform
# manages. Add a model to netbox_hlac_write_types when OpenTofu starts
# managing a new NetBox resource type.
- name: Bootstrap admin, the hlac service user, and its API token
  tags: [config]
  vars:
    ansible_remote_tmp: /tmp
    _key: "{{ NETBOX_API_TOKEN.split('.')[0] | replace('nbt_', '') }}"
    _plaintext: "{{ NETBOX_API_TOKEN.split('.')[1] }}"
    _script: |
      from django.contrib.auth import get_user_model
      from core.models import ObjectType
      from users.models import ObjectPermission, Token
      User = get_user_model()
      changed = False

      admin, _ = User.objects.get_or_create(
          username='admin',
          defaults={'is_superuser': True},
      )
      admin.is_superuser = True
      admin.set_password('{{ netbox_admin_password }}')
      admin.save()

      hlac, created = User.objects.get_or_create(username='hlac')
      changed |= created
      if hlac.is_superuser or not hlac.is_active or hlac.has_usable_password():
          hlac.is_superuser = False
          hlac.is_active = True
          hlac.set_unusable_password()
          hlac.save()
          changed = True

      wanted = {{ netbox_hlac_write_types | to_json }}
      write_types = set()
      for label in wanted:
          app, model = label.split('.')
          write_types |= set(ObjectType.objects.filter(app_label=app, model=model))
      if len(write_types) != len(wanted):
          found = {f'{o.app_label}.{o.model}' for o in write_types}
          raise SystemExit(f'unknown NetBox object types: {sorted(set(wanted) - found)}')
      read_types = set(ObjectType.objects.exclude(app_label='users'))

      # object_types points at ContentType while these are ObjectType rows,
      # and Django never treats instances of different models as equal, so
      # compare primary keys.
      for name, actions, types in [
          ('hlac-read', ['view'], read_types),
          ('hlac-write', ['view', 'add', 'change', 'delete'], write_types),
      ]:
          p, created = ObjectPermission.objects.get_or_create(
              name=name, defaults={'actions': actions},
          )
          if (created or sorted(p.actions) != sorted(actions) or not p.enabled
                  or set(p.object_types.values_list('pk', flat=True)) != {o.pk for o in types}
                  or set(p.users.values_list('pk', flat=True)) != {hlac.pk}):
              p.actions = actions
              p.enabled = True
              p.description = 'hlac service account, managed by Ansible'
              p.save()
              p.object_types.set(types)
              p.users.set([hlac])
              changed = True

      if not Token.objects.filter(key='{{ _key }}', user=hlac).exists():
          Token.objects.filter(key='{{ _key }}').delete()
          Token.objects.filter(description='hlac').delete()
          t = Token(
              user=hlac,
              key='{{ _key }}',
              token='{{ _plaintext }}',
              description='hlac',
              write_enabled=True,
          )
          t.full_clean()
          t.save()
          changed = True

      print('CHANGED' if changed else 'OK')
  ansible.builtin.command:
    cmd: "{{ netbox_root }}/venv/bin/python manage.py shell -c {{ _script | quote }}"
  args:
    chdir: "{{ netbox_root }}/netbox"
  become: true
  become_user: "{{ netbox_user }}"
  register: _nb_bootstrap
  changed_when: "'CHANGED' in _nb_bootstrap.stdout"
  failed_when: false
  no_log: true

# no_log hides the whole result, because the command line carries the admin
# password and token. The script's own error goes to stderr without them, so
# surface its last lines when it fails.
- name: Report bootstrap errors
  tags: [config]
  ansible.builtin.fail:
    msg: "{{ _nb_bootstrap.stderr_lines[-6:] }}"
  when: _nb_bootstrap.rc != 0
