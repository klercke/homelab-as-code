- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart netbox
  ansible.builtin.systemd_service:
    name: netbox
    state: restarted

- name: Restart netbox-rq
  ansible.builtin.systemd_service:
    name: netbox-rq
    state: restarted

- name: Restart nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted
