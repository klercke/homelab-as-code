---
# ProtoNet managed host registry.
#
# This is the source for the substrate OpenTofu module, Ansible host vars, and NetBox device records.
# Address, VMID, MAC, and tags are all derived rather than stored.
#
# memory is the maximum the guest sees. memory_min is the balloon floor Proxmox
# may reclaim down to when the host runs short; omit it to disable reclaim.
#
# crit levels:
#   1  critical infrastructure
#   2  infrastructure, non-critical
#   3  end-user (family/friend) impact
#   4  no impact
#
# All string values are quoted deliberately: see README.md.

hosts:
  postgres01:
    vlan: "home-servers"
    host_octet: 10
    layer: "l1"
    role: "postgres"
    crit: 1
    node: "pve02"
    cores: 4
    memory: 4096  # Ideally 8192 but I am low on RAM
    memory_min: 2048
    disk: 32
    data_disk: 64
    description: "PostgreSQL 18. Central database for most apps."
    ipv6: true

  netbox01:
    vlan: "home-servers"
    host_octet: 11
    layer: "l1"
    role: "netbox"
    crit: 2
    node: "pve02"
    cores: 2
    memory: 4096
    memory_min: 3072
    disk: 32
    description: "NetBox. Source of truth for IPAM and DCIM."
    ipv6: true

