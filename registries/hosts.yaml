  monitoring01:
    vlan: "home-servers"
    host_octet: 20
    layer: "l1"
    role: "monitoring"
    crit: 2
    node: "pve01"
    cores: 4
    memory: 4096
    memory_min: 2048
    disk: 32
    data_disk: 100
