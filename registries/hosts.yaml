---
# ProtoNet managed host registry.
#
# This is the source for the substrate OpenTofu module, Ansible host vars, and NetBox device records.
# Address, VMID, MAC, and tags are all derived rather than stored.
#
# memory is the maximum the guest sees. memory_min is the balloon floor Proxmox
# may reclaim down to when the host runs short; omit it to disable reclaim.
#
# crit levels:
#   1  critical infrastructure
#   2  infrastructure, non-critical
#   3  end-user (family/friend) impact
#   4  no impact
#
# All string values are quoted deliberately: see README.md.

hosts:
  postgres01:
    vlan: "home-servers"
    host_octet: 10
    layer: "l1"
    role: "postgres"
    crit: 1
    node: "pve01"
    cores: 4
    memory: 4096  # Ideally 8192 but I am low on RAM
    memory_min: 2048
    disk: 32
    data_disk: 64
    description: "PostgreSQL 18. Central database for most apps."
    ipv6: false

  netbox01:
    vlan: "home-servers"
    host_octet: 11
    layer: "l1"
    role: "netbox"
    crit: 2
    node: "pve01"
    cores: 2
    memory: 4096
    memory_min: 3072
    disk: 32
    description: "NetBox. Source of truth for IPAM and DCIM."
    ipv6: false

  pdns01:
    vlan: "home-servers"
    host_octet: 12
    layer: "l1"
    role: "pdns"
    crit: 1
    node: "pve01"
    cores: 1
    memory: 2048
    memory_min: 1024
    disk: 16
    description: "PowerDNS Authoritative. Points to postgres for backend."
    ipv6: false

  pdns02:
    vlan: "home-servers"
    host_octet: 13
    layer: "l1"
    role: "pdns"
    crit: 1
    node: "pve01"
    cores: 1
    memory: 2048
    memory_min: 1024
    disk: 16
    description: "PowerDNS Authoritative. Points to postgres for backend."
    ipv6: false

  kea01:
    vlan: "home-servers"
    host_octet: 14
    layer: "l1"
    role: "kea"
    crit: 1
    node: "pve01"
    cores: 1
    memory: 2048
    memory_min: 1024
    disk: 16
    description: "ISC Kea DHCPv4 with HA hook and PostgreSQL backend."
    ipv6: false

  kea02:
    vlan: "home-servers"
    host_octet: 15
    layer: "l1"
    role: "kea"
    crit: 1
    node: "pve01"
    cores: 1
    memory: 2048
    memory_min: 1024
    disk: 16
    description: "ISC Kea DHCPv4 with HA hook and PostgreSQL backend."
    ipv6: false

  recursor01:
    vlan: "home-servers"
    host_octet: 16
    layer: "l1"
    role: "recursor"
    crit: 1
    node: "pve01"
    cores: 2
    memory: 2048
    memory_min: 1024
    disk: 16
    description: "PowerDNS Recursor. Forwards internal zones to pdnsNN servers."
    ipv6: false

  recursor02:
    vlan: "home-servers"
    host_octet: 17
    layer: "l1"
    role: "recursor"
    crit: 1
    node: "pve01"
    cores: 2
    memory: 2048
    memory_min: 1024
    disk: 16
    description: "PowerDNS Recursor. Forwards internal zones to pdnsNN servers."
    ipv6: false

  valkey01:
    vlan: "home-servers"
    host_octet: 18
    layer: "l1"
    role: "valkey"
    crit: 2
    node: "pve01"
    cores: 2
    memory: 2048
    memory_min: 1024
    disk: 16
    description: "Valkey (Redis fork). Cache and RQ task queue for NetBox."
    ipv6: false

  caddy01:
    vlan: "home-servers"
    host_octet: 19
    layer: "l1"
    role: "caddy"
    crit: 2
    node: "pve01"
    cores: 2
