    ipv6: false

  llm01:
    vlan: "home-servers"
    host_octet: 22  # .21 is immich (CT 102 on jotunheim, see devices.yaml)
    layer: "l1"  # Really l2 (a workload); moves when a workloads module exists
    role: "llm"
    crit: 4
    node: "pve01"
    cores: 2
    memory: 4096
    memory_min: 3072
    disk: 32
    description: "LiteLLM gateway and Open WebUI. Routes to GPU workers and cloud models."
    ipv6: false
