---
# ProtoNet VLAN and prefix registry.
#
# VLAN IDs are generated by concatenating their third octet to either 1, 2, or
# 3 for class A, B, and C private address spaces, respectively.
# Note that the second octet for class A addresses is equal to the site index
# (per `sites.yaml`).
# For class B addresses, the second octet is currently undefined.
# For class C addresses, the second octet is always 168.
# For example, at site 0:
#   VLAN 120 -> 10.0.20.0/24
#   VLAN 160 -> 10.0.60.0/24
#   VLAN 210 -> 172.16.10.0/24
#   VLAN 380 -> 192.168.80.0/24
#   VLAN 1250 -> 10.0.250.0/24
#
# Default address plan within each /24 (can be overridden):
#   .1          gateway
#   .2-.9       network infrastructure
#   .10-.49     statically addressed infrastructure hosts
#   .50-.99     reserved
#   .100-.199   DHCP dynamic pool
#   .200-.249   DHCP reservations
#   .250-.254   reserved
#
# All string values are quoted deliberately: see README.md.

vlans:
  clients:
    id: 110
    site: "home"
    fns: "clients"
    name: "Clients"
    prefix: "10.0.10.0/24"
    gateway: "10.0.20.1"
    description: "Non-guest client devices"
    status: "active"
    dhcp:
      enabled: true
      dynamic_start: "10.0.10.101"  # For legacy reasons, THOR is 10.0.10.100
      dynamic_end: "10.0.10.199"
      reservation_start: "10.0.10.200"
      reservation_end: "10.0.10.249"

  servers:
    id: 120
    site: "home"
    fns: "servers"
    name: "Servers"
    prefix: "10.0.20.0/24"
    gateway: "10.0.20.1"
    description: "Server workloads and platform substrate"
    status: "active"
    dhcp:
      enabled: true
      dynamic_start: "10.0.20.100"
      dynamic_end: "10.0.20.199"
      reservation_start: "10.0.20.200"
      reservation_end: "10.0.20.249"

  iot:
    id: 130
    site: "home"
    fns: "iot"
    name: "IoT"
    prefix: "10.0.30.0/24"
    gateway: "10.0.30.1"
    description: "IoT devices"
    status: "active"
    dhcp:
      enabled: true
      dynamic_start: "10.0.30.100"
      dynamic_end: "10.0.30.199"
      reservation_start: "10.0.30.200"
      reservation_end: "10.0.30.249"

  lab:
    id: 140
    site: "home"
    fns: "lab"
    name: "Lab"
    prefix: "10.0.40.0/24"
    gateway: "10.0.40.1"
    description: "Lab for testing new devices"
    status: "active"
    dhcp:
      enabled: true
      dynamic_start: "10.0.40.100"
      dynamic_end: "10.0.40.199"
      reservation_start: "10.0.40.200"
      reservation_end: "10.0.40.249"

  guest:
    id: 150
    site: "home"
    fns: "guest"
    name: "Guest"
    prefix: "10.0.50.0/24"
    gateway: "10.0.50.1"
    description: "Guest-owned devices"
    status: "active"
    dhcp:
      enabled: true
      dynamic_start: "10.0.50.100"
      dynamic_end: "10.0.50.199"
      reservation_start: "10.0.50.200"
      reservation_end: "10.0.50.249"

  management:
    id: 160
    site: "home"
    fns: "management"
    name: "Management"
    prefix: "10.0.60.0/24"
    gateway: "10.0.60.1"
    description: "Hypervisors, switches, APs, and out-of-band management"
    status: "active"
    dhcp:
      enabled: false
