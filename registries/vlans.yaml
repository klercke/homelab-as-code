---
# ProtoNet VLAN and prefix registry.
#
# VLAN IDs are generated by concatenating their third octet to either 1, 2, or
# 3 for class A, B, and C private address spaces, respectively.
# Note that the second octet for class A addresses is equal to the site index
# (per `sites.yaml`).
# For class B addresses, the second octet is currently undefined.
# For class C addresses, the second octet is always 168.
# For example, at site 0:
#   VLAN 120  -> 10.0.20.0/24
#   VLAN 160  -> 10.0.60.0/24
#   VLAN 210  -> 172.16.10.0/24
#   VLAN 380  -> 192.168.80.0/24
#   VLAN 1250 -> 10.0.250.0/24
#
# Class B and C addresses are currently out-of-scope.
#
# If a VLAN has prefix_v4 defined, it must have vlan_id INSTEAD of net_id.
# In this case, neither will be automatically derived downstream and IPv6 will
# be disabled for that VLAN.
#
# Default address plan within each /24 (can be overridden):
#   .1          gateway
#   .2-.9       network infrastructure
#   .10-.49     statically addressed infrastructure hosts
#   .50-.99     reserved
#   .100-.199   DHCP dynamic pool
#   .200-.249   DHCP reservations
#   .250-.254   reserved
#
# All string values are quoted deliberately, see README


vlans:
  home-legacy:
    vlan_id: 1
    prefix_v4: "10.10.10.0/24"
    site: "home"
    fns: "legacy"
    name: "Legacy LAN"
    description: "Untagged. Decommissioning; DHCP still served by OPNsense and therefore out of scope."
    status: "deprecated"
    dhcp_v4:
      enabled: false

  home-clients:
    net_id: 10
    site: "home"
    fns: "clients"
    name: "Clients"
    description: "Non-guest client devices."
    status: "active"
    dhcp_v4:
      enabled: true

  home-servers:
    net_id: 20
    site: "home"
    fns: "servers"
    name: "Servers"
    description: "Server workloads and platform substrate."
    status: "active"
    dhcp_v4:
      enabled: true

  home-iot:
    net_id: 30
    site: "home"
    fns: "iot"
    name: "IoT"
    description: "IoT devices."
    status: "active"
    dhcp_v4:
      enabled: true

  home-lab:
    net_id: 40
    site: "home"
    fns: "lab"
    name: "Lab"
    description: "Lab for testing new devices and services."
    status: "active"
    dhcp_v4:
      enabled: true

  home-guest:
    net_id: 50
    site: "home"
    fns: "guest"
    name: "Guest"
    description: "Guest-owned devices, or devices that don't need access to network resources."
    status: "active"
    dhcp_v4:
      enabled: true

  home-management:
    net_id: 60
    site: "home"
    fns: "management"
    name: "Management"
    description: "Hypervisors, switches, APs, and out-of-band management."
    status: "active"
    dhcp_v4:
      enabled: false
