---
# ProtoNet physical device registry.
#
# Device types marked `library: true` exist in netbox-community/devicetype-library
#
# All string values are quoted deliberately: see README.md.

locations:
  basement:
    site: "home"
    name: "Basement"

racks:
  rack01:
    site: "home"
    location: "basement"
    name: "Rack 01"
    u_height: 32
    form_factor: "4-post-frame"
    desc_units: false

device_roles:
  firewall:
    name: "Firewall"
    color: "f44336"  # #f44336
  switch:
    name: "Switch"
    color: "2196f3"  # #2196f3
  hypervisor:
    name: "Hypervisor"
    color: "9c27b0"  # #9c27b0
  storage:
    name: "Storage"
    color: "ff9800"  # #ff9800
  ups:
    name: "UPS"
    color: "4caf50"  # #4caf50
  access-point:
    name: "Access Point"
    color: "00bcd4"  # #00bcd4
  patch-panel:
    name: "Patch Panel"
    color: "9e9e9e"  # #9e9e9e
  passive:
    name: "Passive"
    color: "607d8b"  # #607db8
  shelf:
    name: "Shelf"
    color: "795548"  # #795548
  sbc:
    name: "Single Board Computer"
    color: "e91e63"  # #e91e63
  workstation:
    name: "Workstation"
    color: "3f51b5"  # #3f51b5
  appliance:
    name: "Appliance"
    color: "eb77db"  # #eb77db
  backup:
    name: "Backup"
    color: "009688"  # #009688
  management:
    name: "Management"
    color: "673ab7"  # #673ab7

device_types:
  protectli-fw4b:
    manufacturer: "Protectli"
    model: "FW4B"
    u_height: 1
    full_depth: false
    library: false

  mikrotik-crs354:
    manufacturer: "MikroTik"
    model: "CRS354-48G-4S+2Q+RM"
    u_height: 1
    full_depth: false
    library: true

  generic-patch-panel-24:
    manufacturer: "Generic"
    model: "24-port Copper Patch Panel"
    u_height: 1
    full_depth: false
    library: true

  datto-dsw100-24p-4x:
    manufacturer: "Datto"
    model: "DSW100-24P-4X"
    u_height: 1
    full_depth: false
    library: true

  pi-shelf-4bay:
    manufacturer: "Generic"
    model: "4-Bay SBC Shelf"
    u_height: 1
    full_depth: false
    library: false
    subdevice_role: "parent"
    bays: 4

  raspberry-pi-4b:
    manufacturer: "Raspberry Pi"
    model: "Raspberry Pi 4 Model B"
    u_height: 0
    full_depth: false
    library: true
    subdevice_role: "child"

  generic-storage-drawer-4u:
    manufacturer: "Generic"
    model: "Storage Drawer 4U"
    u_height: 4
    full_depth: true
    library: true

  rosewill-rsv-r4100u:
    manufacturer: "Rosewill"
    model: "RSV-R4100U"
    u_height: 4
    full_depth: true
    library: false

  hyve-zeus:
    manufacturer: "Hyve Solutions"
    model: "Zeus"
    u_height: 1
    full_depth: true
    library: false

  datto-siris-s4p10:
    manufacturer: "Datto"
    model: "Siris S4P10"
    u_height: 1
    full_depth: true
    library: false

  liebert-gxt4-1000rt120:
    manufacturer: "Vertiv"
    model: "Liebert GXT4-1000RT120"
    # Nominally 2U, but mounts poorly and blocks the unit above it
    u_height: 3
    full_depth: true
    library: false

  datto-ap840e:
    manufacturer: "Datto"
    model: "AP840E"
    u_height: 0
    full_depth: false
    library: true

  generic-workstation:
    manufacturer: "Generic"
    model: "Desktop Workstation"
    u_height: 0
    full_depth: false
    library: false

  # A guest built by hand outside hlac (on jotunheim today). Registered so its
  # name resolves and its address stays reserved; nothing manages it.
  unmanaged-vm:
    manufacturer: "Generic"
    model: "Unmanaged VM"
    u_height: 0
    full_depth: false
    library: false

devices:
  fw01:
    device_type: "protectli-fw4b"
    role: "firewall"
    site: "home"
    rack: "rack01"
    position: 32
    mgmt_ip: "10.0.60.1"
    description: "OPNsense firewall and router. Sits on a 1U shelf."

  sw01:
    device_type: "mikrotik-crs354"
    role: "switch"
    site: "home"
    rack: "rack01"
    position: 31
    mgmt_ip: "10.0.60.11"
    description: "Core switch."

  patch01:
    device_type: "generic-patch-panel-24"
    role: "patch-panel"
    site: "home"
    rack: "rack01"
    position: 30
    description: "24-port copper patch panel."

  sw02:
    device_type: "datto-dsw100-24p-4x"
    role: "switch"
    site: "home"
    rack: "rack01"
    position: 29
    status: "decommissioning"
    description: "Legacy Datto E24 switch. Being decommissioned."

  shelf01:
    device_type: "pi-shelf-4bay"
    role: "shelf"
    site: "home"
    rack: "rack01"
    position: 28
    description: "Four-bay Pi shelf."

  drawer01:
    device_type: "generic-storage-drawer-4u"
    role: "passive"
    site: "home"
    rack: "rack01"
    position: 16
    description: "Storage drawer."

  pve01:
    device_type: "rosewill-rsv-r4100u"
    role: "hypervisor"
    site: "home"
    rack: "rack01"
    position: 6
    mgmt_ip: "10.0.60.20"
    description: "Primary Proxmox VE host. Custom build."

  jotunheim:
    device_type: "hyve-zeus"
    role: "hypervisor"
    site: "home"
    rack: "rack01"
    position: 5
    mgmt_ip: "10.10.10.58"
    status: "decommissioning"
    description: "Secondary Proxmox VE host, runs PBS and PDM."

  nas01:
    device_type: "datto-siris-s4p10"
    role: "storage"
    site: "home"
    rack: "rack01"
    position: 4
    mgmt_ip: "10.0.20.50"
    mac: "d0:50:99:df:03:eb"
    description: "Recycled Siris running TrueNAS Core."

  ups01:
    device_type: "liebert-gxt4-1000rt120"
    role: "ups"
    site: "home"
    rack: "rack01"
    position: 1
    description: "Emerson Liebert GXT4 1000VA. Nominally 2U, mounted horribly."

  ap02:
    device_type: "datto-ap840e"
    role: "access-point"
    site: "home"
    mgmt_ip: "10.0.60.22"
    description: "Primary AP."

  noct01:
    device_type: "raspberry-pi-4b"
    role: "appliance"
    site: "home"
    parent: "shelf01"
    bay: 1
    mac: "e4:5f:01:6a:08:dd"
    mgmt_ip: "10.0.20.32"
    description: "PoE-powered Pi running NOCT server."

  thor:
    device_type: "generic-workstation"
    role: "workstation"
    site: "home"
    mgmt_ip: "10.0.10.213"
    mac: "1a:4b:24:a0:f1:bf"
    description: "Primary desktop. Reserved for for use in firewall rules."

  sdr01:
    device_type: "raspberry-pi-4b"
    role: "appliance"
    site: "home"
    mac: "e4:5f:01:da:bd:a3"
    mgmt_ip: "10.0.30.200"
    description: "Pi sitting upstairs with SDR connected for ADS-B collection."

  homeassistant:
    device_type: "generic-workstation"
    role: "appliance"
    site: "home"
    mac: "00:23:24:b9:72:d1"
    mgmt_ip: "10.0.20.31"
    description: "Mini PC sitting in rack running HAOS."

  immich:
    device_type: "unmanaged-vm"
    role: "appliance"
    site: "home"
    mgmt_ip: "10.0.20.21"
    description: "Immich. Hand-built LXC (CT 102) on jotunheim, outside hlac. Registered so its address is reserved."

  pbs:
    device_type: "unmanaged-vm"
    role: "backup"
    site: "home"
    mgmt_ip: "10.10.10.123"
    description: "Proxmox Backup Server. Hand-built VM 122 on jotunheim, outside hlac. pve01's backup storage."

  pdm:
    device_type: "unmanaged-vm"
    role: "management"
    site: "home"
    mgmt_ip: "10.0.60.100"
    description: "Proxmox Datacenter Manager. Hand-built VM 125 on jotunheim, outside hlac."
