extends: default

rules:
  # Every string quoted: OpenTofu reads YAML 1.2, Ansible reads YAML 1.1.
  # Unquoted `no`/`on`/`010`/`12:34:56` parse differently between them.
  quoted-strings:
    quote-type: any
    required: true
    check-keys: false

  # Reject yes/no/on/off entirely; only true/false.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false

  line-length:
    max: 120

  document-start: disable
